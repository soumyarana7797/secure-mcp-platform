# Registry MANIFEST: what an admin intends to expose. `scripts/registry_admin.py sync` reads
# this, fetches each backend's live tools, and pins the approved definitions into PostgreSQL.
# The running gateway reads only the database.
[[backends]]
name = "football"
url = "http://127.0.0.1:9002/mcp"
audience = "mcp-football"
timeout_s = 5.0

[backends.tools.get_fixtures]
permission = "football:read"

[backends.tools.get_live_scores]
permission = "football:read"
timeout_s = 3.0
