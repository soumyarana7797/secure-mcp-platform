services:
  postgres:
    image: pgvector/pgvector:pg16   # Postgres 16 + pgvector (used by the knowledge server later)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gateway
      GATEWAY_APP_PASSWORD: ${GATEWAY_APP_PASSWORD:?set GATEWAY_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gateway"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
